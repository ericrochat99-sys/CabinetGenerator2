        <!doctype html>
        <html>
        <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>{{STYLES}}</style>
        </head>
        <body>
          <header class="settings-brand"><span>FORGE</span><strong>CASE</strong></header>
          <h2>Global Settings</h2>

          <details class="section" open>
            <summary>Project Defaults</summary>
            <div class="row"><label>Construction Type</label><select id="construction_type"><option>Frameless</option><option>Face Frame</option></select></div>
            <div class="row"><label>Face Frame / Frameless</label><select id="cabinet_construction"><option>Frameless</option><option>Face Frame</option></select></div>
            <div class="row"><label>Base Cabinet Height (in)</label><input id="base_cabinet_height_in" type="number" step="0.001"/></div>
            <div class="row"><label>Wall Cabinet Height (in)</label><input id="wall_cabinet_height_in" type="number" step="0.001"/></div>
            <div class="row"><label>Tall Cabinet Height (in)</label><input id="tall_cabinet_height_in" type="number" step="0.001"/></div>
            <div class="row"><label>Base Cabinet Depth (in)</label><input id="base_cabinet_depth_in" type="number" step="0.001"/></div>
            <div class="row"><label>Wall Cabinet Depth (in)</label><input id="wall_cabinet_depth_in" type="number" step="0.001"/></div>
            <div class="row"><label>Tall Cabinet Depth (in)</label><input id="tall_cabinet_depth_in" type="number" step="0.001"/></div>
            <div class="row"><label>Toe Kick Height (in)</label><input id="toe_kick_height_in" type="number" step="0.001"/></div>
            <div class="row"><label>Countertop Thickness (in)</label><input id="countertop_thickness_in" type="number" step="0.001"/></div>
            <div class="row"><label>Shelf Thickness (in)</label><input id="shelf_thickness_in" type="number" step="0.001"/></div>
            <div class="row"><label>Back Thickness (in)</label><input id="back_thickness_in" type="number" step="0.001"/></div>
            <div class="row"><label>Material Thickness (in)</label><input id="material_thickness_in" type="number" step="0.001"/></div>
            <div class="row"><label>Door Style</label><input id="door_style" type="text"/></div>
            <div class="row"><label>Drawer Box Style</label><input id="drawer_box_style" type="text"/></div>
            <div class="row"><label>Hardware Defaults</label><input id="hardware_defaults" type="text"/></div>
            <div class="row"><label>Default Material</label><input id="default_material" type="text"/></div>
          </details>

          <details class="section">
            <summary>Construction</summary>
            <div class="row"><label>Panel thk (in)</label><input id="panel_thk_in" type="number" step="0.001"/></div>
            <div class="row"><label>Back thk (in)</label><input id="back_thk_in" type="number" step="0.001"/></div>
            <div class="row"><label>Door thk (in)</label><input id="door_thk_in" type="number" step="0.001"/></div>
            <div class="row"><label>Drawer front thk (in)</label><input id="drawer_front_thk_in" type="number" step="0.001"/></div>
            <div class="row"><label>Drawer box thk (in)</label><input id="box_thk_in" type="number" step="0.001"/></div>
            <div class="row"><label>Stretcher width (in)</label><input id="stretcher_width_in" type="number" step="0.001"/></div>
            <div class="row">
              <label>Base top construction</label>
              <select id="base_top_mode">
                <option value="Stretchers">Stretchers</option>
                <option value="Full Top">Full panel</option>
              </select>
            </div>
            <div class="row">
              <label>Tall top construction</label>
              <select id="tall_top_mode">
                <option value="Full Top">Full panel</option>
                <option value="Stretchers">Stretchers</option>
              </select>
            </div>
            <div class="row">
              <label>Back construction</label>
              <select id="back_mode">
                <option value="Full Back">Full back panel</option>
                <option value="Back Stretcher + 1/4 Back">Back stretcher + 1/4&quot; back</option>
              </select>
            </div>
          </details>

          <details class="section">
            <summary>Materials</summary>
            <div class="row"><label>Interior melamine</label><input id="carcass_color_hex" type="color"/></div>
            <div class="row"><label>Exterior finish</label><input id="front_color_hex" type="color"/></div>
            <div class="row"><label>Edgeband</label><input id="edgeband_color_hex" type="color"/></div>
          </details>

          <details class="section">
            <summary>Fronts</summary>

<div class="row"><label>Reveal (in)</label><input id="reveal_in" type="number" step="0.001"/></div>
            <div class="row"><label>Center door gap (in)</label><input id="reveal_center_in" type="number" step="0.001"/></div>
            <div class="row"><label>Double-door threshold (in)</label><input id="automatic_double_door_threshold_in" type="number" step="0.001"/></div>
            <div class="row"><label>Drawer-bank split threshold (in)</label><input id="automatic_drawer_bank_split_threshold_in" type="number" step="0.001"/></div>
          </details>

          <details class="section">
            <summary>Toe Kick</summary>
            <div class="row"><label>Toe kick h (in)</label><input id="toe_kick_h_in" type="number" step="0.001"/></div>
            <div class="row"><label>Toe kick recess (in)</label><input id="toe_kick_recess_in" type="number" step="0.001"/></div>
            <div class="row"><label>Trash pull-out bottom offset (in)</label><input id="trash_drawer_box_bottom_offset_in" type="number" step="0.001"/></div>
          </details>

          <details class="section">
            <summary>Appliance End Panel</summary>
            <div class="row"><label>Front return width (in)</label><input id="aep_front_return_width_in" type="number" step="0.001"/></div>
            <div class="row"><label>Front return thickness (in)</label><input id="aep_front_return_thk_in" type="number" step="0.001"/></div>
          </details>

          <details class="section">
            <summary>Hardware</summary>
            
            <div class="row">
              <label for="pull_kind">Pull style</label>
              <select id="pull_kind">
                <option value="wire_pull">Wire pull</option>
                <option value="knob">Knob</option>
                <option value="bar_pull">Bar pull</option>
                <option value="none">None</option>
              </select>
            </div>
            <div class="row" style="display:none"><label><input id="add_wire_pulls" type="checkbox"/> Wire pulls</label></div>
            <div class="row"><label><input id="drawer_pull_centered" type="checkbox"/> Center drawer pulls vertically</label></div>
            <div class="row"><label><input id="add_hinges" type="checkbox"/> Hinges</label></div>
            <div class="row"><label><input id="add_door_bumpers" type="checkbox"/> Door bumpers</label></div>
            <div class="row"><label><input id="add_shelf_supports" type="checkbox"/> Shelf supports</label></div>
            <div class="row"><label><input id="add_cam_lock" type="checkbox"/> Cam lock</label></div>
            <div class="row"><label><input id="add_countertop_brackets" type="checkbox"/> A&M 21x21 brackets</label></div>
          </details>

          <div class="actions">
            <button class="primary" id="save">Save</button>
            <button id="reset">Reset</button>
            <button id="close">Close</button>
          </div>
  <script>{{SCRIPT}}</script>
        </body>
        </html>
