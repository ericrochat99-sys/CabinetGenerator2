name: Publish v1.1.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish release v1.1.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Validate Ruby syntax
        run: |
          ruby -c skilled_services.rb
          find skilled_services scripts -name "*.rb" -print0 | xargs -0 -n1 ruby -c

      - name: Verify version
        run: |
          version="$(ruby -I. -r./skilled_services/version -e 'print SkilledServices::VERSION')"
          test "$version" = "1.1.0"

      - name: Build RBZ
        run: ruby scripts/build_rbz.rb

      - name: Verify package
        run: unzip -t dist/skilled-services-1.1.0.rbz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0 dist/skilled-services-1.1.0.rbz \
            --target "$GITHUB_SHA" \
            --title "Skilled Services v1.1.0" \
            --generate-notes
