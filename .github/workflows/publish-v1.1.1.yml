name: Publish v1.1.2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish release v1.1.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e6c0f21ea33435b9cabf556a21f5383947d13249
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Validate Ruby syntax
        run: |
          ruby -c skilled_services.rb
          find skilled_services scripts -name "*.rb" -print0 | xargs -0 -n1 ruby -c

      - name: Verify version
        run: |
          version="$(ruby -I. -r./skilled_services/version -e 'print SkilledServices::VERSION')"
          test "$version" = "1.1.2"

      - name: Build and verify RBZ
        run: |
          ruby scripts/build_rbz.rb
          unzip -t dist/skilled-services-1.1.2.rbz

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag v1.1.2 e6c0f21ea33435b9cabf556a21f5383947d13249
          git push origin v1.1.2
          gh release create v1.1.2 dist/skilled-services-1.1.2.rbz \
            --target e6c0f21ea33435b9cabf556a21f5383947d13249 \
            --title "Skilled Services v1.1.2" \
            --generate-notes
