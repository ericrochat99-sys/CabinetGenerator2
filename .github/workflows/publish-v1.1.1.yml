name: Publish v2.0.6

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish release v2.0.6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Validate Ruby syntax
        run: |
          ruby -c skilled_services.rb
          find skilled_services scripts -name "*.rb" -print0 | xargs -0 -n1 ruby -c

      - name: Verify version
        run: |
          version="$(ruby -I. -r./skilled_services/version -e 'print SkilledServices::VERSION')"
          test "$version" = "2.0.6"

      - name: Build and verify RBZ
        run: |
          ruby scripts/build_rbz.rb
          unzip -t dist/skilled-services-2.0.6.rbz

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag v2.0.6 "$GITHUB_SHA"
          git push origin v2.0.6
          gh release create v2.0.6 dist/skilled-services-2.0.6.rbz \
            --target "$GITHUB_SHA" \
            --title "Skilled Services v2.0.6" \
            --generate-notes
